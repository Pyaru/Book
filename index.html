<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মাকতাবা – অনলাইন পাঠাগার</title>
<meta name="theme-color" content="#0f6b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="মাকতাবা">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a24;--mute:#6b766f;--brand:#0f6b4a;--brand2:#0b5139;--line:#e3e0d5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:20px;font-weight:700}
.sbox{display:flex;gap:8px}
.sbox input,.sbox select{border:0;border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
.sbox input{flex:1;min-width:0}
.sbox select{max-width:38%}
#count{font-size:13px;opacity:.85;margin-top:8px}
#types{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#types::-webkit-scrollbar{display:none}
#types button{flex:none;background:rgba(255,255,255,.16);color:#fff;border:1px solid transparent;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
#types button.on{background:#fff;color:var(--brand);font-weight:600}
#types i{font-style:normal;font-size:12px;opacity:.75;margin-left:2px}
.ai{flex:none;font-size:18px;line-height:1;padding:4px 2px}
/* বই / কুরআন ট্যাব */
#views{display:flex;gap:6px;margin-bottom:10px}
#views button{flex:1;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 6px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
#views button.on{background:#fff;color:var(--brand)}
#qtabs{display:none;gap:6px;margin-top:10px}
#qtabs button{flex:none;background:rgba(255,255,255,.16);color:#fff;border:1px solid transparent;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
#qtabs button.on{background:#fff;color:var(--brand);font-weight:600}
#qtabs i{font-style:normal;font-size:12px;opacity:.75;margin-left:2px}
body.vq #qtabs{display:flex}
body.vq #cat,body.vq #types,body.vq #stats,body.vq #resumeBox{display:none}
.st[data-go]{cursor:pointer}
.st small{display:block;font-size:11px;color:var(--mute)}
.qn{flex:none;width:36px;height:36px;border-radius:50%;background:#e7f3ed;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.qhero{background:linear-gradient(135deg,var(--brand),#138a5f);color:#fff;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.qhero .qi{font-size:30px;line-height:1}
.qhero b{display:block;font-size:18px}
.qhero small{opacity:.85}
.qh{font-weight:700;color:var(--brand);margin:14px 2px 8px;font-size:15px}
#audSel{height:34px;border-radius:8px;border:0;background:#2f3a35;color:#fff;font:inherit;font-size:13px;padding:0 6px;max-width:34vw}
#stats{max-width:900px;margin:0 auto;padding:10px 12px 0}
#stats:empty{display:none;padding:0}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center}
.st b{display:block;font-size:20px;color:var(--brand);line-height:1.2}
.st span{font-size:12px;color:var(--mute)}
#resumeBox{max-width:900px;margin:0 auto;padding:10px 12px 0}
#resumeBox:empty{padding:0}
.resume{background:linear-gradient(135deg,var(--brand),#138a5f);color:#fff;border-radius:14px;padding:14px 16px;cursor:pointer}
.resume small{display:block;opacity:.85}
.resume b{display:block;font-size:17px;margin:2px 0;line-height:1.35}
#list{padding:10px 12px 40px;max-width:900px;margin:0 auto}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.item:active{background:#eef6f1}
.item .t{flex:1;font-weight:600;line-height:1.35}
.item .c{font-size:12px;color:var(--mute);margin-top:3px;font-weight:400}
.item .go{color:var(--brand);font-size:20px}
.pill{display:inline-block;background:#e0245e;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:middle}
.empty,.more{text-align:center;color:var(--mute);padding:24px 10px}
.more button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit}

/* Reader */
#reader{position:fixed;inset:0;background:#2b2f2d;display:none;flex-direction:column;z-index:20}
#reader.open{display:flex}
#bar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(20,24,22,.88);color:#fff;flex-wrap:nowrap;transition:opacity .25s}
.hide{opacity:0;pointer-events:none}
.ib.txt{width:auto;padding:0 10px;font-size:13px;font-weight:600}
#bar .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}
.ib{background:#2f3a35;color:#fff;border:0;border-radius:8px;width:38px;height:38px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib:active{background:var(--brand)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#zw{position:absolute;inset:0;transform-origin:50% 50%}
#book{width:100%;height:100%;touch-action:none}
.page{background:#fff;overflow:hidden}
.page canvas{width:100%;height:100%;display:block}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:1}
#zl{position:absolute;inset:0;z-index:2;display:none;touch-action:none}
#stage.zoomed #zl{display:block}
#stage[data-th="night"] .page canvas{filter:invert(.92) hue-rotate(180deg)}
#stage[data-th="night"] .page{background:#0d0f0e}
#stage[data-th="sepia"] .page canvas{filter:sepia(.5) contrast(.95) brightness(.96)}
#stage[data-th="sepia"] .page{background:#f3e7cc}
#msg{position:absolute;color:#fff;text-align:center;padding:20px;max-width:420px;line-height:1.6;z-index:3}
#msg a{color:#7fe3b5}
#msg .pg{height:6px;background:#444;border-radius:3px;margin-top:12px;overflow:hidden}
#msg .pg i{display:block;height:100%;width:0;background:#4cd698}
#foot{position:absolute;bottom:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(20,24,22,.88);color:#fff;font-size:13px;transition:opacity .25s}
#foot input[type=range]{flex:1}
#pn{min-width:78px;text-align:center}
audio{height:34px;max-width:42vw}

/* পড়ার সেটিং প্যানেল */
#sp{position:absolute;top:58px;right:8px;z-index:5;width:min(300px,92vw);background:rgba(20,24,22,.97);color:#fff;border-radius:14px;padding:14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#sp.open{display:block}
#sp h4{margin:0 0 6px;font-size:13px;font-weight:600;opacity:.7}
#sp .chips,#sp .row{display:flex;gap:6px;margin-bottom:12px}
#sp button{flex:1;padding:9px 6px;border:1px solid #3a4a43;background:#26302c;color:#fff;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
#sp button.on{background:var(--brand);border-color:var(--brand)}
#sp input[type=range]{width:100%;margin:2px 0 12px}
#sp .hint{font-size:12px;opacity:.6;margin:-4px 0 12px}

/* হেডার + মেনু */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top h1{margin:0}
.menu{background:rgba(255,255,255,.16);border:0;border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.menu svg{width:22px;height:22px;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
#mode{display:none;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:14px;font-weight:600}
#mode button{background:#fff;color:var(--brand);border:0;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.fv{background:none;border:0;font-size:22px;line-height:1;color:#b9c2bc;padding:6px;cursor:pointer}
.fv.on{color:#e0245e}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:29}
#ov.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:30;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
#drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--brand);color:#fff;font-size:18px}
.dh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#drawer nav{padding:8px;overflow:auto;flex:1}
#drawer nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:13px 12px;border-radius:10px;font:inherit;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
#drawer nav button:active{background:#eef6f1}
#drawer nav button span{width:26px;text-align:center}
#drawer nav button i{margin-left:auto;font-style:normal;background:var(--brand);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;min-width:22px;text-align:center}
#drawer nav button i:empty{display:none}
#drawer hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
#csub{display:none;padding:0 8px 8px 50px}
#csub.open{display:block}
#csub a{display:block;padding:10px 12px;color:var(--brand);text-decoration:none;font-weight:600}
.df{padding:12px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);background:rgba(20,24,22,.94);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* রিডার বারের বাটন: সরু স্ক্রিনে দুই লাইন */
.ib.on{background:var(--brand)}
#bFav.on{color:#ff7aa2}
#bar{flex-wrap:wrap}
#bar .title{flex:1 1 60px;min-width:60px}
@media (max-width:700px){#aud,#audSel,#bDlPdf,#bDlAud{order:1}#aud{flex:1 1 140px;max-width:none}}

/* iOS fallback: rotate whole reader */
#reader.rot{width:100vh;height:100vw;inset:auto;top:0;left:100vw;transform-origin:top left;transform:rotate(90deg)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📚 মাকতাবা – অনলাইন পাঠাগার</h1>
    <button class="menu" id="bMenu" aria-label="মেনু"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div id="views">
    <button data-v="books" class="on">📚 বই</button>
    <button data-v="quran">📖 কুরআন</button>
  </div>
  <div class="sbox">
    <input id="q" type="search" placeholder="বইয়ের নাম লিখে খুঁজুন…" autocomplete="off">
    <select id="cat"><option value="">সব ক্যাটাগরি</option></select>
  </div>
  <div id="qtabs">
    <button data-s="surah" class="on">সূরা <i></i></button>
    <button data-s="para">পারা <i></i></button>
  </div>
  <div id="types">
    <button data-t="" class="on">সব <i></i></button>
    <button data-t="pdf">📄 শুধু পিডিএফ <i></i></button>
    <button data-t="aud">🎧 অডিও আছে <i></i></button>
  </div>
  <div id="mode"><span id="modeLbl"></span><button id="modeX">✕ সব বই</button></div>
  <div id="count">লোড হচ্ছে…</div>
</header>
<div id="stats"></div>
<div id="resumeBox"></div>
<div id="list"></div>

<div id="ov"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dh"><b>মেনু</b><button id="dClose" aria-label="বন্ধ">✕</button></div>
  <nav>
    <button data-m="all"><span>🏠</span>সব বই</button>
    <button id="mQuran"><span>🕌</span>কুরআন</button>
    <button data-m="new"><span>🆕</span>নতুন বই</button>
    <button data-m="top"><span>🔥</span>জনপ্রিয় বই</button>
    <button data-m="rd"><span>📖</span>সম্প্রতি পড়া<i id="nrd"></i></button>
    <hr>
    <button data-m="bm"><span>🔖</span>বুকমার্ক<i id="nbm"></i></button>
    <button data-m="fav"><span>❤️</span>ফেভারিট<i id="nfav"></i></button>
    <button data-m="dl"><span>⬇️</span>ডাউনলোড<i id="ndl"></i></button>
    <button data-m="off"><span>📥</span>অফলাইন বই<i id="noff"></i></button>
    <hr>
    <button id="mInstall" style="display:none"><span>📲</span>অ্যাপ ইনস্টল করুন</button>
    <button id="mShare"><span>📤</span>শেয়ার</button>
    <button id="mContact"><span>📞</span>যোগাযোগ</button>
    <div id="csub"></div>
  </nav>
  <div class="df" id="dfoot"></div>
</aside>
<div id="toast"></div>

<div id="reader">
  <div id="bar">
    <button class="ib" id="bClose" title="বন্ধ">✕</button>
    <div class="title" id="rTitle"></div>
    <button class="ib" id="bFav" title="ফেভারিট">♡</button>
    <button class="ib" id="bBm" title="এই পৃষ্ঠায় বুকমার্ক">🔖</button>
    <button class="ib" id="bSet" title="পড়ার সেটিং">⚙</button>
    <audio id="aud" controls preload="none" style="display:none"></audio>
    <select id="audSel" style="display:none" aria-label="অডিও বাছুন"></select>
    <button class="ib txt" id="bDlPdf" title="বই ডাউনলোড">⬇ PDF</button>
    <button class="ib txt" id="bDlAud" title="অডিও ডাউনলোড" style="display:none">⬇ অডিও</button>
    <button class="ib" id="bLand" title="ল্যান্ডস্কেপ">⟳</button>
    <button class="ib" id="bFull" title="ফুল স্ক্রিন">⛶</button>
  </div>
  <div id="stage" data-th="normal">
    <div id="zw"><div id="book"></div></div>
    <div id="dim"></div>
    <div id="zl"></div>
    <div id="msg"></div>
  </div>
  <div id="sp">
    <h4>পড়ার মোড</h4>
    <div class="chips">
      <button data-th="normal">☀️ সাধারণ</button>
      <button data-th="night">🌙 রাত</button>
      <button data-th="sepia">📜 সেপিয়া</button>
    </div>
    <h4>আলো</h4>
    <input type="range" id="br" min="30" max="100" value="100">
    <h4>জুম</h4>
    <div class="row"><button id="zOut">−</button><button id="zVal">1×</button><button id="zIn">+</button></div>
    <div class="hint">পাতার মাঝখানে ডাবল ট্যাপ করলেও জুম হয়। জুম অবস্থায় আঙুল টেনে সরান, দুই আঙুলে পিঞ্চ করুন।</div>
    <div class="row"><button id="sSnd">🔊 পৃষ্ঠার শব্দ: চালু</button></div>
    <div class="row"><button id="sOff">📥 অফলাইনে সেভ করুন</button></div>
    <div class="row" style="margin-bottom:0"><button id="sShare">🔗 এই বইয়ের লিংক শেয়ার</button></div>
  </div>
  <div id="foot">
    <button class="ib" id="bPrev">‹</button>
    <input type="range" id="rng" min="1" max="1" value="1">
    <span id="pn">–</span>
    <button class="ib" id="bNext">›</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ============ কনফিগ ============ */
const SHEET_ID   = '1A6uF_E2i0Jrnz9TpP2IVfJb26QkVJbbYtZFoPWPzSa4';   // শিটের URL-এ /d/ এবং /edit-এর মাঝের অংশ
const SHEET_NAME = 'Books';                      // ট্যাবের নাম

const QURAN_SHEET_ID   = '1A6uF_E2i0Jrnz9TpP2IVfJb26QkVJbbYtZFoPWPzSa4';                    // কুরআনের আলাদা ফাইল হলে তার আইডি

const CAT_LABELS = {

// বইয়ের লিংক থেকে ছোট স্থায়ী আইডি (?b=... লিংকের জন্য)
function hid(s){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
// সার্চের জন্য লেখা এক রকম করা: বাংলা বানান-ভেদ (য/জ, ণ/ন, শ/ষ/স, ই/ঈ, ু/ূ, ো/ু ...), আরবি/উর্দু হরকত ও অক্ষর-ভেদ
function norm(s){
  s=(s==null?'':String(s)).normalize('NFD').toLowerCase();
  const BD={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
  s=s.replace(/[০-৯]/g,c=>BD[c])
     .replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-0x660))
     .replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-0x6F0))
     .replace(/[̀-ًͯ-ٰٟۖ-ۭ‌‍়্ঁঃ]/g,'')
     .replace(/ো/g,'ু')
     .replace(/[যজ]/g,'জ')
     .replace(/[ণন]/g,'ন')
     .replace(/[শষস]/g,'স')
     .replace(/ঈ/g,'ই').replace(/ী/g,'ি')
     .replace(/ঊ/g,'উ').replace(/ূ/g,'ু')
     .replace(/ৎ/g,'ত').replace(/ং/g,'ঙ')
     .replace(/[يىیےئ]/g,'ی')
     .replace(/[كک]/g,'ک')
     .replace(/[ةہھهۃ]/g,'ه')
     .replace(/[ٱ]/g,'ا')
     .replace(/[^\p{L}\p{M}\p{N}\s]/gu,' ')
     .replace(/([^\d\s])\1+/gu,'$1')
     .replace(/\s+/g,' ').trim();
  return s;
}
function lev(a,b,k){
  if(Math.abs(a.length-b.length)>k)return k+1;
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const c=[i];let min=i;
    for(let j=1;j<=b.length;j++){
      const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      c[j]=v;if(v<min)min=v;
    }
    if(min>k)return k+1;
    p=c;
  }
  return p[b.length];
}
// বানানে ১–২টা ভুল থাকলেও কাছাকাছি শব্দ ধরে
function near(w,t){const k=t.length>=8?2:t.length>=4?1:0;return k>0&&lev(w,t,k)<=k}

/* ===== কুরআন সেকশন: শিটের গঠন =====
   সারি ২–১১৫ সূরা: C=সূরার নাম, D=পিডিএফ, E=সূরার অডিও, G=অনুবাদ অডিও, I=তাফসীর অডিও
   (ফাঁকা সারির পর) পারা: C=পারার নাম, D=পিডিএফ
   (ফাঁকা সারির পর) শেষে সম্পূর্ণ কুরআন: লিংক C-তে (বা D-তে)
   A, B, F, H কলাম আর তার নিচের সিরিয়াল পড়া হয় না। */
async function gvizRows(id,sheet){
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(sheet)}`;
  const t=await (await fetch(url)).text();
  const j=JSON.parse(t.substring(t.indexOf('(')+1,t.lastIndexOf(')')));
  return j.table.rows.map(r=>(r.c||[]).map(c=>c&&c.v!=null?String(c.v).trim():''));
}
function parseQuran(rows){
  const isUrl=s=>/^https?:\/\//i.test(s||'');
  const g=(r,i)=>String((r&&r[i])||'').trim();
  const blocks=[];let cur=null;
  rows.forEach(r=>{                                       // ফাঁকা সারি দিয়ে অংশ আলাদা করা
    if([2,3,4,6,8].some(i=>g(r,i))){if(!cur){cur=[];blocks.push(cur)}cur.push(r)}else cur=null;
  });
  const trimHead=b=>{let i=0;while(i<b.length&&![3,4,6,8].some(k=>isUrl(g(b[i],k))))i++;return b.slice(i)};   // হেডার সারি বাদ
  let surah=trimHead(blocks[0]||[]),para=trimHead(blocks[1]||[]),rest=blocks.slice(2).flat();
  const linkInC=r=>isUrl(g(r,2))&&!g(r,3);
  rest=rest.concat(para.filter(linkInC));para=para.filter(r=>!linkInC(r));      // ফাঁকা সারি ছাড়া নিচে থাকলেও ধরা
  if(!rest.length&&para.length>30)rest=[para.pop()];
  const mk=(r,q,i)=>{
    const link=g(r,3);if(!isUrl(link))return null;
    const aud=[];
    [[4,q==='surah'?'সূরার অডিও':'পারার অডিও'],[6,'অনুবাদ'],[8,'তাফসীর']].forEach(([c,l])=>{const u=g(r,c);if(isUrl(u))aud.push({label:l,url:u})});
    return {q,no:i+1,name:g(r,2)||((q==='surah'?'সূরা ':'পারা ')+bn(i+1)),link,audio:aud[0]?aud[0].url:'',audios:aud};
  };
  const out=[];
  surah.forEach((r,i)=>{const x=mk(r,'surah',i);if(x)out.push(x)});
  para.forEach((r,i)=>{const x=mk(r,'para',i);if(x)out.push(x)});
  const fr=rest.find(r=>isUrl(g(r,2))||isUrl(g(r,3)));
  if(fr){
    const cl=isUrl(g(fr,2)),aud=[4,6,8].map(c=>g(fr,c)).filter(isUrl).map(u=>({label:'অডিও',url:u}));
    out.push({q:'full',no:0,name:(!cl&&g(fr,2))||'সম্পূর্ণ কুরআন',link:cl?g(fr,2):g(fr,3),audio:aud[0]?aud[0].url:'',audios:aud});
  }
  return out;
}
function setQuran(items){

}

/* পৃষ্ঠা উল্টানোর শব্দ: Web Audio দিয়ে বানানো (আলাদা ফাইল লাগে না, অফলাইনেও চলে) */
let AC=null,SNDBUF=null,lastSnd=0;
function ensureAC(){                                     // ফোনের নিয়মে শব্দ চালু করতে প্রথম ছোঁয়ায় তৈরি/জাগিয়ে রাখা
  if(PREF.snd===false)return null;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
  return AC;
}
function flipSound(force){
  if(!force&&(PREF.snd===false||!$('aud').paused))return;   // তিলাওয়াত/অডিও চলার সময় বাজবে না
  const now=Date.now();if(now-lastSnd<250)return;lastSnd=now;
  const ctx=force?(PREF.snd=true,ensureAC()):ensureAC();if(!ctx)return;
  try{
    if(!SNDBUF||SNDBUF.sampleRate!==ctx.sampleRate){       // কাগজ ওল্টানোর মতো: ছোট নয়েজ + দ্রুত মিলিয়ে যাওয়া
      const len=Math.floor(ctx.sampleRate*0.3);SNDBUF=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=SNDBUF.getChannelData(0);
      for(let i=0;i<len;i++){const p=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-p,1.8)*Math.min(1,p*40);}
    }
    const t=ctx.currentTime,src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
    src.buffer=SNDBUF;bp.type='bandpass';bp.Q.value=0.8;
    bp.frequency.setValueAtTime(900,t);bp.frequency.exponentialRampToValueAtTime(3800,t+0.25);
    g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    src.connect(bp);bp.connect(g);g.connect(ctx.destination);src.start(t);
  }catch(e){}
}
$('reader').addEventListener('pointerdown',()=>{ensureAC()},{passive:true});
$('sSnd').onclick=()=>{

};

function clampPan(){
  const W=$('stage').offsetWidth,H=$('stage').offsetHeight,mx=(Z-1)*W/2,my=(Z-1)*H/2;

}
function applyZoom(){

function setZoom(z,fx,fy){
  z=Math.max(1,Math.min(4,z));
  if(z<1.05){Z=1;PX=PY=0;applyZoom();return}
  const W=$('stage').offsetWidth,H=$('stage').offsetHeight;
  if(fx==null){fx=W/2;fy=H/2}
  const px=fx-W/2,py=fy-H/2;
  PX=px-z*(px-PX)/Z;PY=py-z*(py-PY)/Z;Z=z;clampPan();applyZoom();
}
function toggleZoom(cx,cy){
  if(!pdf)return;
  if(Z>1){setZoom(1);return}
  if(R.classList.contains('rot')){setZoom(2.2);return}
  const r=$('stage').getBoundingClientRect();setZoom(2.2,cx-r.left,cy-r.top);
}
$('zIn').onclick=()=>pdf&&setZoom(Math.max(Z,1)*1.4);
$('zOut').onclick=()=>pdf&&setZoom(Z/1.4);
$('zVal').onclick=()=>setZoom(1);
(function(){      // জুম অবস্থায় আঙুল টেনে সরানো ও দুই আঙুলে পিঞ্চ
  const zl=$('zl'),ptrs=new Map();let pinch=null;
  zl.addEventListener('pointerdown',e=>{
    try{zl.setPointerCapture(e.pointerId)}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:Z}}
  });
  zl.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    const rot=R.classList.contains('rot');
    if(ptrs.size>=2&&pinch){
      const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(rot)setZoom(pinch.z*d/pinch.d);
      else{const r=$('stage').getBoundingClientRect();setZoom(pinch.z*d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}
    }else if(Z>1){
      if(rot){PX+=dy;PY-=dx}else{PX+=dx;PY+=dy}
      clampPan();applyZoom();
    }
  });
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null};
  zl.addEventListener('pointerup',up);zl.addEventListener('pointercancel',up);
})();

/* বার অটো-হাইড: ফুল স্ক্রিনের বাইরে ছুঁলে ফের আসে, ৩ সেকেন্ডে লুকায় */
let flipping=false,tap=null;
const inFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement)||$('reader').classList.contains('rot');
function hideBars(){
  clearTimeout(hideT);
  if($('msg').style.display==='block')return;          // লোড/এরর মেসেজ থাকলে বার থাকবে
  if($('sp').classList.contains('open'))return;        // সেটিং প্যানেল খোলা থাকলে বার থাকবে
  $('bar').classList.add('hide');$('foot').classList.add('hide');
}
function showBars(){
  if(flipping)return;                                   // পেজ ফ্লিপের সময় বার আসবে না
  $('bar').classList.remove('hide');$('foot').classList.remove('hide');
  clearTimeout(hideT);hideT=setTimeout(hideBars,3000);
}
const barsAuto=()=>inFs()?hideBars():showBars();
['pointerdown','pointermove'].forEach(ev=>$('reader').addEventListener(ev,()=>{if(!inFs())showBars()},{passive:true}));
const localY=(cx,cy)=>$('reader').classList.contains('rot')?window.innerWidth-cx:cy;
$('reader').addEventListener('pointerdown',e=>{
  if($('sp').classList.contains('open')&&!(e.target.closest&&e.target.closest('#sp,#bSet')))$('sp').classList.remove('open');
  tap={x:e.clientX,y:e.clientY,t:Date.now(),el:e.target};
},{passive:true});
$('reader').addEventListener('pointerup',e=>{
  const t=tap;tap=null;
  if(!t||flipping)return;
  if(Math.hypot(e.clientX-t.x,e.clientY-t.y)>12||Date.now()-t.t>500)return;   // সোয়াইপ/লং প্রেস নয়
  if(t.el.closest&&t.el.closest('#bar,#foot,#sp'))return;
  const rot=R.classList.contains('rot'),lx=rot?t.y:t.x,ly=localY(t.x,t.y),W=R.offsetWidth,now=Date.now();
  if(pdf&&ly>=90){
    // পাতার ধারে ট্যাপ = পেজ ওল্টানো; মাঝখানে ডাবল ট্যাপ = জুম
    if(Z===1&&flip&&lx<W*.18){lastTap=null;flip.flipPrev();return}
    if(Z===1&&flip&&lx>W*.82){lastTap=null;flip.flipNext();return}
    if(lastTap&&now-lastTap.t<330&&Math.hypot(t.x-lastTap.x,t.y-lastTap.y)<40){lastTap=null;toggleZoom(t.x,t.y);return}
    lastTap={x:t.x,y:t.y,t:now};
  }
  if(!inFs())return;                                    // ফুল স্ক্রিনে: উপরের অংশে ট্যাপ করলে বার আসে
  const on=!$('bar').classList.contains('hide');
  if(ly<90)showBars();else if(on)hideBars();
});

function saveBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name.replace(/[\\/:*?"<>|]+/g,'_');document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}

/* ===== দ্রুত লোড =====
   আগে পুরো ফাইল নামিয়ে তারপর খোলা হতো। এখন PDF.js ফাইল নামার সাথে সাথেই (স্ট্রিম) এবং সার্ভার
   রেঞ্জ দিলে শুধু দরকারি অংশ নামিয়ে প্রথম পাতা খুলে দেয়। ক্রম:
   অফলাইন → সরাসরি → Cloudflare Worker → Apps Script (সবচেয়ে ধীর, পুরো ফাইল base64-এ আসে) */
const hostOf=u=>{try{return new URL(u).host}catch(e){return u}};
function directBad(u){const m=load('mk_direct',{})[hostOf(u)];return !!(m&&m.bad&&Date.now()-m.ts<864e5)}   // ২৪ ঘণ্টা মনে রাখে
function markDirect(u,bad){const m=load('mk_direct',{});m[hostOf(u)]={bad,ts:Date.now()};store('mk_direct',m)}
function streamTask(url,onProg){
  const t=pdfjsLib.getDocument({url,rangeChunkSize:524288,disableAutoFetch:true,disableStream:false});
  t.onProgress=p=>{if(p&&p.total)onProg(p.loaded/p.total)};
  return t;
}
const notPdfErr=e=>e&&(e.name==='MissingPDFException'||e.name==='InvalidPDFException');
async function loadDoc(b,my,onProg,note){
  const url=b.link,go=t=>{task=t;return t.promise};
  const off=await offGet(url);
  if(my!==token)return null;
  if(off){                                              // ০) অফলাইনে সেভ করা
    curBlob=new Blob([off],{type:'application/pdf'});note('অফলাইন');onProg(1);
    return go(pdfjsLib.getDocument({data:off}));
  }
  const hasFallback=!!(FAST_PROXY||PROXY_URL);
  if(!hasFallback||!directBad(url)){                    // ১) সরাসরি
    try{note('সরাসরি');const d=await go(streamTask(url,onProg));markDirect(url,false);return d}
    catch(e){
      if(my!==token)return null;
      if(!notPdfErr(e)&&navigator.onLine)markDirect(url,true);
      if(!hasFallback||notPdfErr(e))throw e;
    }
  }
  if(FAST_PROXY){                                       // ২) Cloudflare Worker (রেঞ্জ + স্ট্রিম)
    try{note('প্রক্সি');return await go(streamTask(FAST_PROXY+'?url='+encodeURIComponent(url),onProg))}
    catch(e){if(my!==token)return null;if(!PROXY_URL||notPdfErr(e))throw e}
  }
  note('Apps Script — ধীর');                            // ৩) Apps Script: পুরো ফাইল একসাথে
  const r=await fetch(PROXY_URL+'?url='+encodeURIComponent(url));
  const b64=(await r.text()).trim();
  if(my!==token)return null;
  if(!b64||b64.startsWith('ERR'))throw new Error(b64||'proxy');
  const bin=atob(b64),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  curBlob=new Blob([u],{type:'application/pdf'});onProg(1);
  return go(pdfjsLib.getDocument({data:u}));
}

// শেষ পড়া পৃষ্ঠা মনে রাখা
let lpT;
function saveLast(now){
  if(!curBook||!total||!flip)return;
  const L=curBook.link,T=total,page=Math.min(flip.getCurrentPageIndex()+1,T);
  const doIt=()=>{
    if(page>1)LP[L]={page,total:T,ts:Date.now()};else delete LP[L];
    const keys=Object.keys(LP);
    if(keys.length>300)keys.sort((a,b)=>LP[a].ts-LP[b].ts).slice(0,keys.length-300).forEach(k=>delete LP[k]);
    store('mk_last',LP);
  };
  clearTimeout(lpT);
  if(now)doIt();else lpT=setTimeout(doIt,500);
}

async function openBook(b,startPage){
  const my=++token;
  $('reader').classList.add('open');document.body.style.overflow='hidden';
  if(!(history.state&&history.state.r)){try{history.pushState({r:1},'','?b='+b.id)}catch(e){}}
  $('rTitle').textContent=b.name;
  curBook=b;curBlob=null;setZoom(1);applyPref();$('sp').classList.remove('open');
  const a=$('aud'),A=b.audios||[],sel=$('audSel');
  if(A.length){a.src=A[0].url;a.style.display='block';$('bDlAud').style.display='flex'}
  else{a.removeAttribute('src');a.style.display='none';$('bDlAud').style.display='none'}
  sel.innerHTML='';A.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.label;sel.appendChild(o)});
  sel.style.display=A.length>1?'block':'none';          // একাধিক অডিও থাকলে (সূরা/অনুবাদ/তাফসীর) বাছাই করা যাবে
  destroy();barsAuto();paintReader();
  msg('বই লোড হচ্ছে…<div class="pg"><i id="pgi"></i></div><small id="via" style="opacity:.55"></small>');
  try{
    const doc=await loadDoc(b,my,
      p=>{const i=$('pgi');if(i)i.style.width=Math.min(100,p*100)+'%'},
      v=>{const e=$('via');if(e)e.textContent='('+v+')'});
    if(my!==token||!doc){if(my!==token&&doc)try{doc.destroy()}catch(e){}return}
    pdf=doc;
    total=pdf.numPages;
    const p1=await pdf.getPage(1),vp=p1.getViewport({scale:1});
    const W=vp.width,H=vp.height;
    const book=$('book');book.innerHTML='';
    for(let i=0;i<total;i++){
      const d=document.createElement('div');d.className='page';
      if(i===0||i===total-1)d.dataset.density='hard';
      const c=document.createElement('canvas');d.appendChild(c);book.appendChild(d);
    }
    flip=new St.PageFlip(book,{
      width:Math.round(W),height:Math.round(H),size:'stretch',
      minWidth:180,maxWidth:1400,minHeight:240,maxHeight:2000,
      showCover:true,usePortrait:true,mobileScrollSupport:false,disableFlipByClick:true,
      maxShadowOpacity:.4,flippingTime:600,drawShadow:true
    });
    flip.loadFromHTML(book.querySelectorAll('.page'));
    flip.on('flip',e=>{sync(e.data);renderAround(e.data);saveLast()});
    flip.on('changeState',e=>{
      if(e.data==='flipping')flipSound();                // পাতা উল্টানো শুরু হলে শব্দ (স্লাইডারে লাফ দিলে বাজে না)
      if(e.data==='user_fold'||e.data==='flipping'){flipping=true;hideBars()}
      else if(e.data==='read')flipping=false;
    });
    flip.on('changeOrientation',()=>renderAround(flip.getCurrentPageIndex()));
    $('rng').max=total;$('rng').value=1;
    msg('');
    const want=startPage||(LP[b.link]?LP[b.link].page:1);        // বুকমার্ক বা শেষ পড়া পৃষ্ঠা থেকে শুরু
    const sp=Math.min(Math.max(want-1,0),total-1);
    if(sp>0){flip.turnToPage(sp);toast('পৃষ্ঠা '+(sp+1)+' থেকে শুরু')}
    sync(sp);renderAround(sp);barsAuto();paintReader();hit(b);
  }catch(err){
    if(my!==token)return;
    const offline=!navigator.onLine;
    msg(offline
      ?'ইন্টারনেট নেই।<br><small>এই বইটি অফলাইনে সেভ করা নেই।</small>'
      :`বইটি এখানে খোলা গেল না।<br><small>(সার্ভার ব্রাউজারকে সরাসরি ফাইল পড়তে দেয়নি, বা ফাইলটি PDF নয়)</small><br><br><a href="${b.link}" target="_blank" rel="noopener">নতুন ট্যাবে খুলুন / ডাউনলোড</a>`);
  }
}

function destroy(){
  try{flip&&flip.destroy()}catch(e){}
  flip=null;flipping=false;
  try{task?task.destroy():pdf&&pdf.destroy()}catch(e){}   // চলমান ডাউনলোডও বন্ধ হয়ে যায়
  task=null;pdf=null;rendered.clear();total=0;
  // page-flip-এর destroy() নিজেই #book এলিমেন্টটা DOM থেকে সরিয়ে দেয়, তাই $('book') খুঁজে না নিয়ে #zw-এর ভেতরে নতুন করে বানানো হয়
  const zw=$('zw');zw.innerHTML='';
  const n=document.createElement('div');n.id='book';zw.appendChild(n);
  $('pn').textContent='–';$('rng').max=1;$('rng').value=1;
}

async function renderPage(i){
  if(!pdf||i<0||i>=total||rendered.has(i))return;
  rendered.add(i);
  const my=token,pg=await pdf.getPage(i+1);
  const base=pg.getViewport({scale:1}),sc=Math.min(2.2,1100/base.width*(window.devicePixelRatio>1?1.3:1));
  const vp=pg.getViewport({scale:sc});
  const c=document.querySelectorAll('#book .page canvas')[i];
  if(!c||my!==token)return;
  c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
}
function renderAround(i){[0,1,-1,2,3,-2,4,5].forEach(d=>renderPage(i+d))}   // আগে বর্তমান পাতা, তারপর পাশের

function sync(idx){
  const n=idx+1;
  $('pn').textContent=n+' / '+total;$('rng').value=Math.min(n,total);
}

$('bNext').onclick=()=>flip&&flip.flipNext();
$('bPrev').onclick=()=>flip&&flip.flipPrev();
$('rng').oninput=e=>{if(flip){const i=+e.target.value-1;flip.turnToPage(i);sync(i);renderAround(i);saveLast()}};
$('bClose').onclick=closeReader;
function closeReader(){
  if(history.state&&history.state.r){history.back();return}   // ফোনের ব্যাক বাটনের সাথে মেলানো
  doClose();
}
function doClose(){
  if(!$('reader').classList.contains('open'))return;
  saveLast(true);
  token++;exitFs();unrot();$('aud').pause();$('sp').classList.remove('open');
  $('reader').classList.remove('open');document.body.style.overflow='';destroy();setZoom(1);
  if(location.search){try{history.replaceState(null,'',BASE)}catch(e){}}
  if(view==='quran')renderQuran();else if(mode!=='all')apply();else renderResume();
  refreshHearts();updateBadges();
}
window.addEventListener('popstate',()=>{if($('reader').classList.contains('open'))doClose()});
document.addEventListener('keydown',e=>{
  if(!$('reader').classList.contains('open'))return;
  if(e.key==='ArrowLeft')flip&&flip.flipPrev();
  if(e.key==='ArrowRight')flip&&flip.flipNext();
  if(e.key==='Escape'&&!document.fullscreenElement)closeReader();
});

/* ফুল স্ক্রিন */
const R=$('reader');
const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
async function enterFs(){try{if(R.requestFullscreen)await R.requestFullscreen();else if(R.webkitRequestFullscreen)R.webkitRequestFullscreen()}catch(e){}}
async function exitFs(){try{if(isFs()){document.exitFullscreen?await document.exitFullscreen():document.webkitExitFullscreen()}}catch(e){}
  try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}}
$('bFull').onclick=()=>isFs()?exitFs():enterFs();

/* ল্যান্ডস্কেপ */
function unrot(){R.classList.remove('rot');relayout();barsAuto()}
function relayout(){setTimeout(()=>{try{flip&&flip.update()}catch(e){}if(Z>1){clampPan();applyZoom()}},250)}
$('bLand').onclick=async()=>{
  if(R.classList.contains('rot')){unrot();return}
  const portrait=window.innerHeight>window.innerWidth;
  if(!portrait){ // আগে থেকেই আড়াআড়ি হলে পোর্ট্রেটে ফেরার সুযোগ
    try{screen.orientation.lock('portrait')}catch(e){}return;
  }
  if(!isFs())await enterFs();
  try{await screen.orientation.lock('landscape');relayout();return}catch(e){}
  // লক সাপোর্ট না থাকলে (আইফোন) – পেজ নিজে ঘুরিয়ে দেখানো
  R.classList.add('rot');relayout();barsAuto();
};
const onFsChange=()=>{if(!isFs()){try{screen.orientation.unlock()}catch(e){}}relayout();barsAuto()};
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('resize',relayout);
window.addEventListener('orientationchange',()=>{unrot()});

updateBadges();
init();
</script>
</body>
</html>
